<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Morka</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="launcher/launcher.css">
  <script src="app-setup.js" defer></script>
  <script src="launcher/cell.js" defer></script>
</head>
<body class="launcher">
  <header class="titlebar" aria-hidden="true"></header>
  <main id="morka-home" aria-label="Morka">
    <canvas aria-hidden="true"></canvas>
    <button type="button" id="new-app" aria-label="Swipe right or press Enter to create an app" aria-describedby="birth-caption" aria-haspopup="dialog"></button>
    <div id="launcher-caption">
      <p id="birth-caption">swipe to born another <span>morka</span></p>
      <button type="button" id="wake-project" aria-haspopup="dialog">or wake up a morka…</button>
    </div>
  </main>
  <dialog class="app-setup" id="wake-dialog" aria-labelledby="wake-title">
    <form>
      <h2 id="wake-title">Wake up a morka</h2>
      <div class="wake-pickers">
        <button type="button" class="app-button" id="wake-folder" autofocus>Choose Folder…</button>
        <button type="button" class="app-button" id="wake-archive">Choose Archive…</button>
      </div>
      <label for="wake-git-url">or its git url</label>
      <input id="wake-git-url" type="text" placeholder="https://example.com/your-morka.git" maxlength="2048" spellcheck="false" required>
      <span id="wake-status" role="status" hidden></span>
      <div class="setup-actions">
        <button type="button" class="app-button" id="wake-cancel">Cancel</button>
        <button type="submit" class="app-button primary">Launch</button>
      </div>
    </form>
  </dialog>
</body>
</html>
