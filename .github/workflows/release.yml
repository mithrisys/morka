name: Release Morka

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify the release tag and its CI run
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          result=$(gh run list --workflow ci.yml --branch main --event push --commit "$(git rev-parse HEAD)" --limit 1 --json conclusion --jq '.[0].conclusion')
          test "$result" = success || { echo "Release the tagged commit after its main CI run passes."; exit 1; }
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm run check:versions
      - run: npm ci
      - run: npm run build -- --portable
      - name: Prepare the canonical release kit
        run: |
          mkdir -p release/canonical-kit
          cp dist/archives/*.tgz release/canonical-kit/
          node scripts/releases/project-lock.mjs release/canonical-kit/project-lock.json
      - uses: actions/cache/save@v5
        with:
          path: release/canonical-kit
          key: morka-release-${{ github.run_id }}-${{ github.run_attempt }}-npm
          enableCrossOsArchive: true

  desktop:
    needs: prepare
    uses: ./.github/workflows/desktop.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}
    secrets:
      MORKA_MAC_CERTIFICATE: ${{ secrets.MORKA_MAC_CERTIFICATE }}
      MORKA_MAC_CERTIFICATE_PASSWORD: ${{ secrets.MORKA_MAC_CERTIFICATE_PASSWORD }}
      MORKA_MAC_NOTARY_KEY: ${{ secrets.MORKA_MAC_NOTARY_KEY }}
      MORKA_MAC_NOTARY_KEY_ID: ${{ secrets.MORKA_MAC_NOTARY_KEY_ID }}
      MORKA_MAC_NOTARY_ISSUER: ${{ secrets.MORKA_MAC_NOTARY_ISSUER }}
      MORKA_WINDOWS_CERTIFICATE: ${{ secrets.MORKA_WINDOWS_CERTIFICATE }}
      MORKA_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.MORKA_WINDOWS_CERTIFICATE_PASSWORD }}
      MORKA_WINDOWS_PUBLISHER: ${{ secrets.MORKA_WINDOWS_PUBLISHER }}

  draft:
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: release/downloads
          key: morka-release-${{ github.run_id }}-${{ github.run_attempt }}-desktop-macOS-arm64
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v5
        with:
          path: release/downloads
          key: morka-release-${{ github.run_id }}-${{ github.run_attempt }}-desktop-Windows-x64
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v5
        with:
          path: release/downloads
          key: morka-release-${{ github.run_id }}-${{ github.run_attempt }}-desktop-Windows-arm64
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v5
        with:
          path: release/downloads
          key: morka-release-${{ github.run_id }}-${{ github.run_attempt }}-desktop-Linux-x64
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v5
        with:
          path: release/downloads
          key: morka-release-${{ github.run_id }}-${{ github.run_attempt }}-desktop-Linux-arm64
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Verify release notes and downloads
        env:
          MORKA_WINDOWS_UPDATES: ${{ secrets.MORKA_WINDOWS_PUBLISHER != '' && secrets.MORKA_WINDOWS_CERTIFICATE != '' && secrets.MORKA_WINDOWS_CERTIFICATE_PASSWORD != '' }}
        run: |
          mv release/downloads downloads
          mkdir metadata
          node scripts/releases/metadata.mjs downloads metadata/release-notes.md
          mv downloads/SHA256SUMS.txt metadata/
      - name: Stage verified assets and notes
        run: |
          set -euo pipefail
          cp metadata/SHA256SUMS.txt downloads/
          (cd downloads && sha256sum --check --strict SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --json isDraft > state.json; then
            if ! jq -e '.isDraft' state.json >/dev/null; then
              echo "Release $RELEASE_TAG is already public."
              exit 0
            fi
            gh release edit "$RELEASE_TAG" --notes-file metadata/release-notes.md
          else
            prerelease=false
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease="$prerelease" --title "Morka $RELEASE_TAG" --notes-file metadata/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" downloads/* --clobber

  publish:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: release/canonical-kit
          key: morka-release-${{ github.run_id }}-${{ github.run_attempt }}-npm
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Publish the runtime and packager
        run: |
          set -euo pipefail
          for component in runtime packager; do
            file="./release/canonical-kit/morka-${component}.tgz"
            name="@morkaai/$component"
            version="${RELEASE_TAG#v}"
            tar -xOf "$file" package/package.json | jq -e --arg name "$name" --arg version "$version" '.name == $name and .version == $version' > /dev/null
            expected="sha512-$(openssl dgst -sha512 -binary "$file" | openssl base64 -A)"
            url="https://registry.npmjs.org/@morkaai%2f$component/$version"
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/manifest.json" --write-out '%{http_code}' "$url")
            channel=latest
            if [[ "$version" == *-* ]]; then channel=next; fi
            case "$status" in
              404) npm publish "$file" --tag "$channel" --access public --registry=https://registry.npmjs.org/ ;;
              200) echo "Verifying the existing $name@$version before continuing." ;;
              *) echo "Registry lookup for $name@$version returned HTTP $status."; exit 1 ;;
            esac
            # npm can accept a publish before the public registry serves its metadata.
            for attempt in {1..30}; do
              if actual=$(npm view "$name@$version" dist.integrity --fetch-retries=0 --prefer-online --registry=https://registry.npmjs.org/); then
                break
              fi
              if [ "$attempt" -eq 30 ]; then exit 1; fi
              sleep 20
            done
            test "$actual" = "$expected" || { echo "Published integrity differs for $name@$version."; exit 1; }
          done

  publish-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the completed GitHub Release
        run: |
          set -euo pipefail
          state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [[ "$state" == true ]]; then gh release edit "$RELEASE_TAG" --draft=false; fi
