name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow:
    name: Development workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm run check:versions
      - name: Check the topic branch and its commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOPIC_BRANCH: ${{ github.head_ref }}
        run: npm run check:history -- "$BASE_SHA" "$HEAD_SHA" "$TOPIC_BRANCH"

  test:
    name: Test on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: Windows
            runner: windows-latest
          - platform: macOS
            runner: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:workflow
      - run: npm test
      - name: Test live preview in a virtual display
        if: runner.os == 'Linux'
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npm run test:preview
      - name: Test live preview
        if: runner.os != 'Linux'
        run: npm run test:preview
      - name: Test macOS packaging and installation
        if: runner.os == 'macOS'
        run: |
          npm run test:package:mac
          npm run test:install:mac
