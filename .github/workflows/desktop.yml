name: Desktop downloads

on:
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - '.github/workflows/release.yml'
      - 'scripts/releases/**'
      - 'host/**'
      - 'packages/**'
      - 'scripts/build.mts'
      - 'scripts/npm-kit.mts'
      - 'test/desktop-*'
      - 'package*.json'
      - 'CHANGELOG.md'
  workflow_call:
    inputs:
      commit:
        description: Verified release commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Package on ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm cpio
      - uses: actions/cache/restore@v5
        if: inputs.commit != ''
        with:
          path: release/canonical-kit
          key: morka-release-${{ github.run_id }}-${{ github.run_attempt }}-npm
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - run: npm run package:desktop
        env:
          MORKA_RELEASE_PROJECT_LOCK: ${{ inputs.commit && 'release/canonical-kit/project-lock.json' || '' }}
      - name: Mount and test the disk image
        if: runner.os == 'macOS'
        run: bash scripts/releases/test-dmg.sh release/downloads/*.dmg
      - name: Install and test the per-user setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release/downloads/*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "Morka Desktop"
          $version = node -p 'require("./package.json").version'
          $install = Start-Process -FilePath $setup -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          node test/desktop-download.mjs "$dir/Morka-$version.exe" "$dir/resources"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstall = Start-Process -FilePath "$dir/Uninstall Morka-$version.exe" -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)" }
      - name: Extract and test the Linux application
        if: runner.os == 'Linux'
        run: |
          version=$(node -p 'require("./package.json").version')
          runtime="morka-${version,,}"
          tar -xzf release/downloads/*.tar.gz -C "$RUNNER_TEMP"
          xvfb-run -a node test/desktop-download.mjs "$RUNNER_TEMP/morka/$runtime" "$RUNNER_TEMP/morka/resources"
      - name: Install and test the Debian package
        if: runner.os == 'Linux'
        run: |
          version=$(node -p 'require("./package.json").version')
          runtime="morka-${version,,}"
          sudo apt-get install -y --no-install-recommends ./release/downloads/*.deb
          test "$(dpkg-query -W -f='${Architecture}' "$runtime")" = "$(dpkg --print-architecture)"
          bash test/desktop-menu.sh / "$runtime"
          xvfb-run -a node test/desktop-download.mjs "/usr/bin/$runtime" "/opt/Morka-$version/resources"
      - name: Extract and test the RPM package
        if: runner.os == 'Linux'
        run: |
          version=$(node -p 'require("./package.json").version')
          runtime="morka-${version,,}"
          rpm_arch=x86_64
          if [ "$(uname -m)" = aarch64 ]; then rpm_arch=aarch64; fi
          test "$(rpm -qp --queryformat '%{NAME}:%{ARCH}' release/downloads/*.rpm)" = "$runtime:$rpm_arch"
          mkdir "$RUNNER_TEMP/rpm"
          rpm2cpio release/downloads/*.rpm | (umask 022; cd "$RUNNER_TEMP/rpm" && cpio -idm --quiet)
          bash test/desktop-menu.sh "$RUNNER_TEMP/rpm" "$runtime"
          xvfb-run -a node test/desktop-download.mjs "$RUNNER_TEMP/rpm/opt/Morka-$version/$runtime" "$RUNNER_TEMP/rpm/opt/Morka-$version/resources"
      - uses: actions/cache/save@v5
        if: inputs.commit != ''
        with:
          path: release/downloads
          key: morka-release-${{ github.run_id }}-${{ github.run_attempt }}-desktop-${{ runner.os }}-${{ matrix.arch }}
          enableCrossOsArchive: true
